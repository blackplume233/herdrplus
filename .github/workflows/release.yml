name: release

# 打 tag（v0.1.0 / v0.2.0 …）即发布到 VS Code Marketplace，并把 vsix 附到 GitHub Release。
# 需要仓库 secret：VSCE_PAT（Azure DevOps PAT，scope = Marketplace → Manage）
# 可选 secret：OVSX_PAT（Open VSX，给 VSCodium/Cursor 那类客户端）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（如 0.2.0）；留空则用 package.json 里的版本'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify VSCE_PAT (fail fast with a clear hint)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::缺少仓库 secret VSCE_PAT（Settings → Secrets and variables → Actions）。"
            exit 1
          fi
          publisher="$(node -p "require('./package.json').publisher")"
          if ! npx --yes @vscode/vsce verify-pat "$publisher"; then
            echo "::error::VSCE_PAT 不被 Marketplace 接受。检查三件事：① Organization 选 All accessible organizations（不是单个组织）② Scopes → Show all scopes → Marketplace → Manage ③ 该 PAT 属于 publisher「$publisher」的拥有者账号；粘进 secret 时不要带空格/换行。"
            exit 1
          fi
          echo "PAT 校验通过：$publisher"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "vsix=herdrplus-${version}.vsix" >> "$GITHUB_OUTPUT"

      - name: Sync package.json version
        if: steps.version.outputs.version != ''
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository --out "${{ steps.version.outputs.vsix }}"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::缺少仓库 secret VSCE_PAT（Settings → Secrets and variables → Actions），无法发布。"
            exit 1
          fi
          npx --yes @vscode/vsce publish --packagePath "${{ steps.version.outputs.vsix }}"

      - name: Publish to Open VSX (optional)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "跳过：未配置 OVSX_PAT。"
            exit 0
          fi
          npx --yes ovsx publish "${{ steps.version.outputs.vsix }}" -p "$OVSX_PAT"

      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "HerdrPlus $tag（详见 CHANGELOG.md）"
          gh release upload "$tag" "${{ steps.version.outputs.vsix }}" --clobber
