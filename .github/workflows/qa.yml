name: qa

# 真机端到端：装 herdr → 装 VS Code（官方 archive，免安装）→ 用 CDP 驱动扩展跑 38 条断言，截图存档。
# 只在 Windows runner 上跑（herdr 用 ConPTY，VSCode 要 GUI 会话），默认手动/每晚触发，不挡 PR。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 每天 02:00（北京时间）

jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install herdr (official installer)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -c "irm https://herdr.dev/install.ps1 | iex"
          herdr --version
          herdr status

      - name: Install VS Code (portable archive)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vscode.zip"
          Invoke-WebRequest -Uri 'https://update.code.visualstudio.com/latest/win32-x64-archive/stable' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\vscode" -Force
          "$env:RUNNER_TEMP\vscode\Code.exe" --version
          "HERDRPLUS_CODE_PATH=$env:RUNNER_TEMP\vscode\Code.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: bun run build

      - name: Run QA (real VS Code + isolated herdr session)
        run: node src/test/agent/verify.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-screenshots
          path: reports/qa
          if-no-files-found: ignore
