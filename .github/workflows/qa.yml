name: qa

# 真机端到端：装 herdr → 装 VS Code（官方 archive，免安装）→ 用 CDP 驱动扩展跑完整 QA，截图存档。
# Windows runner（herdr 用 ConPTY、VS Code 要 GUI 会话），默认手动/每晚触发，不挡 PR。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 每天 02:00（北京时间）

jobs:
  e2e:
    runs-on: windows-latest
    env:
      # verify.mjs 认这个变量指定宿主 VS Code（默认找 %LOCALAPPDATA%\Programs\Microsoft VS Code）
      CODE_HOST_EXE: ${{ github.workspace }}\vscode\Code.exe
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install herdr (official installer)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -c "irm https://herdr.dev/install.ps1 | iex"
          # 安装器只把 PATH 写进「未来的会话」，这里把当前版本目录显式接到后续步骤
          $exe = Get-ChildItem "$env:USERPROFILE\.herdr\packages\standalone\releases" -Recurse -Filter herdr.exe |
            Select-Object -First 1
          if (-not $exe) { throw "herdr.exe 没装上" }
          $exe.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exe.FullName --version
          & $exe.FullName status | Out-String | Write-Host

      - name: Install VS Code (portable archive)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vscode.zip"
          Invoke-WebRequest -Uri 'https://update.code.visualstudio.com/latest/win32-x64-archive/stable' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "${{ github.workspace }}\vscode" -Force
          & "${{ github.workspace }}\vscode\Code.exe" --version

      - name: Build
        run: bun run build

      - name: Run QA (real VS Code + isolated herdr session)
        run: node src/test/agent/verify.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-screenshots
          path: reports/qa
          if-no-files-found: ignore
